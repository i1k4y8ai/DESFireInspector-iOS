name: Build project

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create project structure
        run: |
          mkdir -p DESFireInspector
          mkdir -p DESFireInspector/NFC
          mkdir -p DESFireInspector/Models

          cat > DESFireInspector/README.md <<'EOF'
          # DESFire Inspector iOS

          Native iOS Core NFC inspector for authorized MIFARE DESFire testing.

          ## Scope
          - Detect DESFire tags
          - Display public tag information
          - Inspect publicly accessible applications
          - Report protected applications
          - No credential cloning
          - No key extraction
          - No access-control bypass
          EOF

          cat > DESFireInspector/NFC/NFCManager.swift <<'EOF'
          import Foundation
          import CoreNFC

          final class NFCManager: NSObject, ObservableObject, NFCTagReaderSessionDelegate {
              @Published var status = "Prêt"
              @Published var result = ""

              private var session: NFCTagReaderSession?

              func scan() {
                  guard NFCTagReaderSession.readingAvailable else {
                      status = "NFC indisponible"
                      return
                  }

                  status = "Approche le badge..."
                  session = NFCTagReaderSession(
                      pollingOption: [.iso14443],
                      delegate: self,
                      queue: nil
                  )
                  session?.alertMessage = "Approche ton badge NFC."
                  session?.begin()
              }

              func tagReaderSessionDidBecomeActive(_ session: NFCTagReaderSession) {
                  DispatchQueue.main.async {
                      self.status = "Recherche..."
                  }
              }

              func tagReaderSession(
                  _ session: NFCTagReaderSession,
                  didInvalidateWithError error: Error
              ) {
                  DispatchQueue.main.async {
                      self.status = "Session terminée"
                  }
              }

              func tagReaderSession(
                  _ session: NFCTagReaderSession,
                  didDetect tags: [NFCTag]
              ) {
                  guard let tag = tags.first else { return }

                  session.connect(to: tag) { error in
                      if let error {
                          DispatchQueue.main.async {
                              self.status = "Erreur"
                              self.result = error.localizedDescription
                          }
                          return
                      }

                      switch tag {
                      case .miFare(let mifare):
                          let uid = mifare.identifier
                              .map { String(format: "%02X", $0) }
                              .joined(separator: " ")

                          DispatchQueue.main.async {
                              self.status = "DESFire/MIFARE détecté"
                              self.result = """
                              Type: \(mifare.mifareFamily)
                              UID: \(uid)
                              Identifier: \(mifare.identifier.count) octets
                              """
                          }

                      default:
                          DispatchQueue.main.async {
                              self.status = "Tag détecté"
                              self.result = "Technologie non prise en charge par cet inspecteur."
                          }
                      }

                      session.invalidate()
                  }
              }
          }
          EOF

          cat > DESFireInspector/ContentView.swift <<'EOF'
          import SwiftUI

          struct ContentView: View {
              @StateObject private var nfc = NFCManager()

              var body: some View {
                  NavigationStack {
                      VStack(spacing: 24) {
                          Image(systemName: "wave.3.right.circle")
                              .font(.system(size: 64))

                          Text("DESFire Inspector")
                              .font(.title.bold())

                          Text(nfc.status)
                              .foregroundStyle(.secondary)

                          Button("Scanner le badge") {
                              nfc.scan()
                          }
                          .buttonStyle(.borderedProminent)

                          ScrollView {
                              Text(nfc.result.isEmpty ? "Aucun badge analysé." : nfc.result)
                                  .frame(maxWidth: .infinity, alignment: .leading)
                                  .padding()
                                  .background(.thinMaterial)
                                  .clipShape(RoundedRectangle(cornerRadius: 16))
                          }
                      }
                      .padding()
                      .navigationTitle("NFC")
                  }
              }
          }
          EOF

          cat > DESFireInspector/DESFireInspectorApp.swift <<'EOF'
          import SwiftUI

          @main
          struct DESFireInspectorApp: App {
              var body: some Scene {
                  WindowGroup {
                      ContentView()
                  }
              }
          }
          EOF

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Generate DESFire Inspector iOS project"
          git push
